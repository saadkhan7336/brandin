<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Brandly</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- AIDE webchat (Brandly support agent) -->
    <script
      src="http://localhost:3000/embed.js?v=11"
      data-aide-key="zhsi1XYQbmkob9GjxLPtPOx0"
      defer
    ></script>
    <!--
      Signed-in visitors (ACCOUNT tools): pass an Aide-signed HS256 identity JWT
      (mint from your backend). Raw browser customerId / setUser subject alone
      never unlocks ACCOUNT_READ on the public embed.
      See Deploy → Signed-in visitors.
      Live WRITE tools always Confirm in the widget before calling your API.
      Guest lookups must return redacted data only.
      Docs: docs/features/EMBED_END_USER_IDENTITY.md
    -->
    <!-- After site login (every page load while signed in) — optional for guest chat:
    <script>
      window.__AIDE_CHAT_USER__ = {
        subject: "user_123",
        displayName: "Alex",
        accessToken: "MERCHANT_SESSION_OR_API_TOKEN"
      };
      window.aideChat && aideChat.setUser(window.__AIDE_CHAT_USER__);
      aideChat.onAuthRefreshNeeded = async function () {
        const accessToken = await fetchFreshAccessToken();
        window.__AIDE_CHAT_USER__ = { subject: "user_123", displayName: "Alex", accessToken };
        aideChat.setUser(window.__AIDE_CHAT_USER__);
      };
    </script>
    -->

    -->
  </body>
</html>
